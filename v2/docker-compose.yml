services:
  voicemailapp:
    build: .
    image: voicemailapp:v2
    container_name: voicemailapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - voicemail-data:/data
    environment:
      # Referenced from config.yaml as ${VAR}; put the values in a .env file
      # next to this compose file (or remove these lines and write the
      # secrets directly in config.yaml).
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SSH_PASSWORD=${SSH_PASSWORD}

volumes:
  voicemail-data:
