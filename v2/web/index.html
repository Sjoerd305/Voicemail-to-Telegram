<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voicemail</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon"></span>
        <span class="brand-name">Voicemail</span>
      </div>
      <div id="health" class="health">
        <span class="dot"></span>
        <span class="health-text">verbinden…</span>
      </div>
    </div>
  </header>

  <main>
    <section class="stats" id="stats" aria-label="Statistieken">
      <div class="stat accent" id="stat-open"><span class="stat-value">–</span><span class="stat-label">Open</span></div>
      <div class="stat" id="stat-today"><span class="stat-value">–</span><span class="stat-label">Vandaag</span></div>
      <div class="stat" id="stat-week"><span class="stat-value">–</span><span class="stat-label">Deze week</span></div>
      <div class="stat" id="stat-total"><span class="stat-value">–</span><span class="stat-label">Totaal</span></div>
      <div class="stat" id="stat-poll"><span class="stat-value">–</span><span class="stat-label">Laatste poll</span></div>
    </section>

    <section class="card chart-card">
      <h2>Voicemails per dag <span class="muted">— laatste 14 dagen</span></h2>
      <div id="chart" class="chart"></div>
    </section>

    <div class="columns">
      <section class="main-col">
        <div class="section-head">
          <h2>Voicemails</h2>
          <div class="filters" id="filters" role="group" aria-label="Filter voicemails">
            <button data-filter="all" class="active">Alles</button>
            <button data-filter="open">Open</button>
            <button data-filter="done">Afgehandeld</button>
          </div>
          <input id="search" type="search" placeholder="Zoeken…" aria-label="Zoeken in voicemails">
        </div>
        <div id="voicemails" class="voicemails"></div>
      </section>

      <aside class="side-col">
        <section class="card" id="actions-section">
          <h2>Acties</h2>
          <div id="actions" class="actions"></div>
        </section>

        <section class="card">
          <h2>Activiteit</h2>
          <div id="events" class="events"></div>
        </section>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast" hidden role="status"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
