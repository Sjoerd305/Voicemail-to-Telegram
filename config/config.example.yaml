# Copy to config.yaml and fill in. Any value may reference an environment
# variable as ${VAR_NAME}.

imap:
  server: mail.example.com
  port: 993
  email: someemail@example.com
  password: ${IMAP_PASSWORD}
  subject_filter: PBX      # only mails whose subject contains this are processed
  # Keep one connection open and let the server push new-mail notifications
  # (IMAP IDLE) instead of logging in on a timer. Set to false to force plain
  # polling; the watcher also falls back to it when the server has no IDLE.
  use_idle: true
  # Only used when idling: how often to check anyway, as a safety net for a
  # missed notification and to notice a dropped connection.
  idle_fallback_interval: 2m
  # Only used when not idling.
  poll_interval: 30s

telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: -123456789      # the group chat; commands from other chats are ignored

transcription:
  enabled: true
  language: nl-NL
  google_credentials: /config/googlekey.json
  # Recognition model: "telephony" (default) is tuned for phone audio and
  # billed at the enhanced rate; "latest_long" or "default" also work.
  # model: telephony
  # Recommended. When set, ALL audio is routed through this bucket (objects
  # are deleted right after transcription; give the bucket a 1-day lifecycle
  # delete rule as a safety net). When empty, audio is sent inline, which
  # Google limits to ~60 seconds per voicemail.
  gcs_bucket: ""

# FreePBX HTTP API, used for the storingsdienst phone number switch.
pbx_ip: 192.168.1.10

ssh:
  host: 192.168.1.10
  port: 22
  username: root
  password: ${SSH_PASSWORD}

# Chat/web commands. type: ssh runs the command on the PBX over SSH,
# type: http does a GET request to the url.
commands:
  deletevm:
    type: ssh
    command: "rm -f /var/spool/asterisk/voicemail/default/9001/INBOX/*.*"
    success: "Voicemail verwijderd."
    error: "Probleem bij verwijderen voicemail."
    description: "Voicemail verwijderen van de centrale (stopt terugbellen)"  # shown in /info
    primary: true   # frequently used: shown as prominent button in the web UI
  vivia:
    type: ssh
    command: "/var/lib/misc/vivia/vivia.sh"
    success: "Storingsdienst naar Vivia"
    error: "Probleem bij omzetten storingsdienst"
    group: storingsdienst
  avics:
    type: ssh
    command: "/var/lib/misc/avics/avics.sh"
    success: "Storingsdienst naar Avics"
    error: "Probleem bij omzetten storingsdienst"
    group: storingsdienst

# /name in Telegram switches the storingsdienst to this number via the PBX.
phone_numbers:
  name1: "0612345678"
  name2: "0612345678"

cleanup:
  enabled: true
  schedule: "0 9 * * 5"    # Friday 09:00
  timezone: Europe/Amsterdam

web:
  enabled: true
  listen: ":8080"
  password: ""             # set to enable basic auth (username: admin)
  # Address where users reach the dashboard; when set, Telegram voicemail
  # messages end with "Bekijk de melding ook op <url>". Leave empty to omit.
  public_url: "http://192.168.1.5:8080"
  # Google sign-in for the dashboard. Enabled as soon as client_id is set;
  # public_url is then required (OAuth redirect URL = <public_url>/auth/callback,
  # register that exact URL in the Google Cloud Console).
  google_auth:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    # Who may log in: email domains, or single addresses when they contain an @.
    allowed_domains:
      - example.com
      - extern@gmail.com

storage:
  database: /data/voicemail.db
  audio_dir: /data/audio
  audio_retention_days: 90   # recordings older than this are deleted; text is kept forever (0 = keep audio forever)

# Voicemails that are still open this long after they came in are marked as
# afgehandeld automatically. On weekdays the meldingen are handled by a party
# that does not use this dashboard, so without it the open list keeps growing.
# Display only: no /deletevm or any other command is run, and reopening a
# melding by hand keeps it open for good. Set to 0s to switch the sweep off.
auto_done_after: 2h

# Checks whether each voicemail is followed by activity in Xurrent: a new
# request on request_team, or a note typed by one of the people below. Without
# activity within `window` a warning goes to Telegram and the dashboard shows
# "Geen Xurrent-activiteit". Detection only; nothing is forwarded. Xurrent
# failures are never read as "no activity". Try it on past voicemails first
# with xurrent-backtest (see README); that works with enabled: false.
xurrent:
  enabled: false
  base_url: https://api.xurrent.com/v1   # or api.au / api.uk / api.ch / api.us.xurrent.com
  account: bedrijf                        # X-Xurrent-Account
  # Personal access token. Needs read access to requests and notes; people
  # and teams only when they are given by name below (ids need no lookup).
  token: ${XURRENT_TOKEN}
  people:                                 # exact Xurrent names whose activity counts
    - Vivia
  # person_ids: [1234]                    # the same by id, when a name is not unique
  # member_teams: [Engineers]             # all current members of these teams count too
  request_team: 2e lijn                   # only new requests on this team count (name or id)
  window: 1h
  # A repeat call from the same number within this period counts as covered
  # when the earlier voicemail was followed by activity.
  repeat_window: 4h

# Optional: free-form text appended below the dynamically generated /info
# command list. The list itself is always built from this config.
# info_file: /config/info.txt
customers_file: /config/customers.json
