# Pinned so the data volume stays v2_voicemail-data now that the app no
# longer lives in a v2/ folder (compose derives names from the folder).
name: v2


services:
  voicemailapp:
    build: .
    image: voicemailapp:v2
    container_name: voicemailapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - voicemail-data:/data
    environment:
      # Local timezone for the dashboard counters and the Friday 16:30
      # storingsdienst week boundary. The image defaults to this already.
      - TZ=Europe/Amsterdam
      # Referenced from config.yaml as ${VAR}; put the values in a .env file
      # next to this compose file (or remove these lines and write the
      # secrets directly in config.yaml).
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SSH_PASSWORD=${SSH_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

volumes:
  voicemail-data:
